name: Release

on:
  push:
    tags: ["v*"] # stable release: push a tag like v1.2.3 on main
    # Note: GitHub does not evaluate path filters for tag pushes,
    # so tagged stable releases always run.
    paths-ignore: ["**.md"]

permissions:
  contents: write # create releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git describe finds the latest tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          # Stable release: version = the pushed tag.
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=${DATE}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            EXT=""
            [ "$GOOS" = "windows" ] && EXT=".exe"
            # No version in the filename: `immich-admin update` replaces this
            # binary in place, keeping its original name, so a version baked
            # into the name would go stale the moment it self-updates. The
            # `immich-admin --version` output and the release tag remain the
            # source of truth for the installed version.
            OUT="dist/immich-admin_${GOOS}_${GOARCH}${EXT}"
            echo "Building $OUT"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/immich-admin
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
