name: Preview build

# Every PR gets downloadable executables for testing: the built binaries are
# attached to the workflow run as an artifact (PR page -> Checks -> Artifacts).
# Stable releases are unaffected (they still come from release.yml on v* tags).
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read
  issues: write # post/update the sticky preview-binaries PR comment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: pr-${{ github.event.pull_request.number }}
          CGO_ENABLED: "0"
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=${DATE}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            EXT=""
            [ "$GOOS" = "windows" ] && EXT=".exe"
            OUT="dist/immich-admin_${GOOS}_${GOARCH}${EXT}"
            echo "Building $OUT"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/immich-admin
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload preview binaries
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: immich-admin-pr-${{ github.event.pull_request.number }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Comment download links on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- preview-binaries -->"
          BODY="$MARKER
          ## Preview binaries (commit \`${GITHUB_SHA::7}\`)

          Download test executables for this PR (linux/darwin/windows + \`checksums.txt\`) from the run's **Artifacts** section (GitHub login required):
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts

          Or with the CLI: \`gh run download ${{ github.run_id }} -n immich-admin-pr-${{ github.event.pull_request.number }} -R ${{ github.repository }}\`"
          PR="${{ github.event.pull_request.number }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR" --body "$BODY" -R "${{ github.repository }}"
          fi
