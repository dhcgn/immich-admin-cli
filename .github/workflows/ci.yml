name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not gofmt-formatted:" && echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify generated client, README API table, and agent skill are up to date
        run: |
          go generate ./...
          git diff --exit-code internal/immichapi/ README.md immich-admin-cli/SKILL.md \
            || (echo "::error::Generated client, README API table, or agent skill is stale. Run 'go generate ./...' and commit." && exit 1)
